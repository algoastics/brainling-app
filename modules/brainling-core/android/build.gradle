plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.algoastics.brainling.core'
version = '0.1.0'

android {
  namespace "com.algoastics.brainling.core"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  buildFeatures {
    buildConfig true
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20240303'
}
